# This is a basic workflow to help you get started with Actions

name: Build

# Controls when the action will run. Triggers the workflow on push or pull request
# events but only for the master branch
on:
  workflow_dispatch:
  push:
    branches: ["**"]
    tags:
      - "v*"
  pull_request:
    branches:
      - "main"
      - "develop"
      - "leptos-migration"

jobs:
  rust-build:
    runs-on: ubuntu-latest
    env:
      # The registry host is a repo variable now (a hostname is not a
      # credential, and masking it renders every push line as `***`). The
      # secret of the same name stays as a fallback.
      REGISTRY: ${{ vars.DOCKER_REGISTRY || secrets.DOCKER_REGISTRY }}
      # The name the deployed container was created from
      # (docker.javapl.us/time-tracking-leptos:main), which is what Watchtower
      # matches its `?image=` list against — see the notify step.
      PUBLIC_REGISTRY: ${{ vars.DOCKER_PUBLIC_REGISTRY || vars.DOCKER_REGISTRY || secrets.DOCKER_REGISTRY }}
      # `secrets` is not a context `if:` can read, so resolve it here and gate
      # on the env value, as the sibling repos do for the registry.
      HAS_WATCHTOWER: ${{ secrets.WATCHTOWER_HTTP_API_TOKEN != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # The registry is reached over Tailscale, not its public
      # Cloudflare-proxied hostname: Bot Fight Mode 403s `docker login` (it is
      # zone-wide and cannot be scoped to a host or path), and the free plan's
      # 100 MB body cap 413s any layer above it, since `docker push` sends each
      # blob as one unchunked PUT. The OAuth client registers an ephemeral
      # `tag:ci` node that Tailscale reaps when the job ends.
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          # The registry is a Tailscale Service, whose virtual IP lives only in
          # MagicDNS. `tailscale up` accepts DNS by default and the action adds
          # no flags of its own, but pin it: without it the name never resolves.
          args: --accept-dns=true
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/time-tracking-leptos
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      # `network=host` is load-bearing: the registry cache export below needs
      # the docker-container driver, and that container's embedded resolver
      # will not forward to the host's loopback systemd-resolved stub — it
      # falls back to public DNS, where the tailnet name does not exist.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host
      - name: Login to Docker registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/time-tracking-leptos:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/time-tracking-leptos:buildcache,mode=max
      - name: Trigger Watchtower update
        # Notify Watchtower to pull the exact image:tag refs we just pushed and
        # redeploy any container running them. Passes every tag from the
        # metadata step as a comma-separated ?image= list so Watchtower scopes
        # the update to this image instead of scanning every container it
        # watches.
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          WATCHTOWER_HTTP_API_TOKEN: ${{ secrets.WATCHTOWER_HTTP_API_TOKEN }}
          # Tailnet origin: Bot Fight Mode would 403 this curl on the public
          # hostname just as readily as it does `docker login`.
          WATCHTOWER_URL: ${{ vars.WATCHTOWER_URL || 'https://watchtower.javapl.us' }}
        run: |
          if [ "$HAS_WATCHTOWER" != "true" ]; then
            echo "::warning::WATCHTOWER_HTTP_API_TOKEN is not set — pushed the image but did NOT trigger a redeploy."
            exit 0
          fi
          # The image NAMES stay public even though the push went to the
          # tailnet: the container is deployed as
          # docker.javapl.us/time-tracking-leptos:main and Watchtower matches
          # `?image=` against that ref literally, so a tailnet-prefixed list
          # would match nothing, return 200 and update nothing.
          images=$(printf '%s\n' "$IMAGE_TAGS" \
            | grep -v '^[[:space:]]*$' \
            | sed "s|^${REGISTRY}/|${PUBLIC_REGISTRY}/|" \
            | paste -sd, -)
          echo "Notifying Watchtower to update: $images"
          curl -fsS --retry 3 --retry-delay 5 --retry-connrefused -X POST \
            -H "Authorization: Bearer ${WATCHTOWER_HTTP_API_TOKEN}" \
            "${WATCHTOWER_URL}/v1/update?image=${images}"
