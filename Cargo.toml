[package]
name = "time-tracking-leptos"
version = "0.1.3"
authors = ["Steven Carter <steve@javapl.us>"]
edition = "2024"
publish = false
default-run = "time-tracking-leptos"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "time-tracking-leptos"
path = "src/main.rs"

[dependencies]
# Always-on — compiled into both the server binary and the wasm bundle.
leptos = { version = "0.8", features = ["nightly"] }
leptos_router = { version = "0.8", features = ["nightly"] }
leptos_meta = "0.8"
serde = "1.0.219"
serde_json = "1.0"
thiserror = "2.0"
# Pinned rev, not a version range: v0.2.0 changes parse_time_tracking_data's
# signature from 1 argument to 3, so an unpinned manifest would silently
# break the build on a fresh checkout.
time-tracking-parser = { git = "https://github.com/stevenwcarter/time-tracking-parser", rev = "cf34921b9a0b92001d949d353bf65146f3aa27b1" }

# Hydrate-only (wasm).
console_error_panic_hook = { version = "0.1", optional = true }
wasm-bindgen = { version = "0.2.100", optional = true }
wasm-bindgen-futures = { version = "0.4.50", optional = true }
web-sys = { version = "0.3.77", optional = true, features = [
  "Clipboard",
  "Navigator",
  "Storage",
  "Window",
] }

# SSR-only (server binary).
axum = { version = "0.8", optional = true }
leptos_axum = { version = "0.8", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"], optional = true }

[features]
default = []
hydrate = [
  "leptos/hydrate",
  "dep:console_error_panic_hook",
  "dep:wasm-bindgen",
  "dep:wasm-bindgen-futures",
  "dep:web-sys",
]
ssr = [
  "leptos/ssr",
  "leptos_meta/ssr",
  "leptos_router/ssr",
  "dep:leptos_axum",
  "dep:axum",
  "dep:tokio",
]

[profile.release]
codegen-units = 1
opt-level = 'z'
lto = true

[profile.wasm-release]
inherits = "release"
opt-level = 'z'
lto = true
codegen-units = 1
panic = "abort"

[package.metadata.leptos]
output-name          = "time-tracking-leptos"
site-root            = "target/site"
site-pkg-dir         = "pkg"
# Local dev only. The Docker image overrides this with LEPTOS_SITE_ADDR=0.0.0.0:80,
# because binding port 80 locally would need privileges.
site-addr            = "127.0.0.1:3000"
reload-port          = 3001
assets-dir           = "public"
tailwind-input-file  = "style/tailwind.css"
browserquery         = "defaults"
env                  = "DEV"
bin-features         = ["ssr"]
bin-default-features = false
lib-features         = ["hydrate"]
lib-default-features = false
lib-profile-release  = "wasm-release"
