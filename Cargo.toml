[package]
name = "time-tracking-leptos"
version = "0.1.3"
authors = ["Steven Carter <steve@javapl.us>"]
edition = "2024"
publish = false
default-run = "time-tracking-leptos"

[package.metadata.cargo-machete]
ignored = ["libsqlite3-sys"]

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "time-tracking-leptos"
path = "src/main.rs"

[dependencies]
# Always-on — compiled into both the server binary and the wasm bundle.
leptos = { version = "0.8", features = ["nightly"] }
leptos_router = { version = "0.8", features = ["nightly"] }
leptos_meta = "0.8"
serde = "1.0.219"
serde_json = "1.0"
thiserror = "2.0"
# Pinned rev, not a version range: v0.2.0 changes parse_time_tracking_data's
# signature from 1 argument to 3, so an unpinned manifest would silently
# break the build on a fresh checkout.
time-tracking-parser = { git = "https://github.com/stevenwcarter/time-tracking-parser", rev = "cf34921b9a0b92001d949d353bf65146f3aa27b1" }
chrono = { version = "0.4", default-features = false, features = [
  "clock", "std", "serde", "wasmbind",
] }
# Shared between hydrate and ssr — the phase-2 envelope is read and written
# by both the browser and the server.
base64 = { version = "0.22", optional = true }

# Hydrate-only (wasm).
console_error_panic_hook = { version = "0.1", optional = true }
wasm-bindgen = { version = "0.2.100", optional = true }
wasm-bindgen-futures = { version = "0.4.50", optional = true }
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3.77", optional = true, features = [
  "Clipboard",
  "Navigator",
  "Storage",
  "Window",
  "Document",
  "Element",
  "HtmlElement",
  "HtmlMetaElement",
  "History",
  "Location",
  "AuthenticationExtensionsClientInputs",
  "AuthenticatorAssertionResponse",
  "AuthenticatorAttestationResponse",
  "AuthenticatorResponse",
  "CredentialCreationOptions",
  "CredentialRequestOptions",
  "CredentialsContainer",
  "PublicKeyCredential",
  "PublicKeyCredentialCreationOptions",
  "PublicKeyCredentialDescriptor",
  "PublicKeyCredentialRequestOptions",
  "IdbFactory",
  "IdbOpenDbRequest",
  "IdbDatabase",
  "IdbTransaction",
  "IdbTransactionMode",
  "IdbObjectStore",
  "IdbRequest",
  "IdbVersionChangeEvent",
  "Event",
  "EventTarget",
  "DomException",
] }

# SSR-only (server binary).
axum = { version = "0.8", optional = true }
axum-extra = { version = "0.12", features = ["cookie"], optional = true }
leptos_axum = { version = "0.8", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"], optional = true }
diesel = { version = "2.2", default-features = false, features = [
  "sqlite", "r2d2", "chrono", "returning_clauses_for_sqlite_3_35",
], optional = true }
diesel_migrations = { version = "2.2", features = ["sqlite"], optional = true }
# -sys crate pinned so the static SQLite is bundled (no system libsqlite3) and
# stays under diesel's `<0.38.0` ceiling. Consumed only through diesel, never
# named in our source — which is why cargo-machete cannot see it.
libsqlite3-sys = { version = "0.37", features = ["bundled"], optional = true }
lettre = { version = "0.11", default-features = false, features = [
  "smtp-transport", "tokio1-rustls-tls", "builder",
], optional = true }
ring = { version = "0.17", optional = true }
hex = { version = "0.4", optional = true }
# v5: a stable per-user UUID for WebAuthn registration, derived from the
# user's email so re-registering never creates a second WebAuthn "user".
uuid = { version = "1", features = ["v7", "v5"], optional = true }
anyhow = { version = "1", optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
dotenvy = { version = "0.15", optional = true }
webauthn-rs = { version = "0.6.1-dev", features = [
  "danger-allow-state-serialisation", "conditional-ui",
], optional = true }
# `oneshot`, used by `test_support::SessionClient::call` to dispatch requests.
# A regular dependency (not dev-only): `test_support` is part of the library,
# not `#[cfg(test)]` — `tests/` is a separate crate and cannot see
# `#[cfg(test)]` items. Axum pulls tower in transitively but does not
# re-export it, so `oneshot` needs its "util" feature explicitly.
tower = { version = "0.5", default-features = false, features = [
  "util",
], optional = true }

[dev-dependencies]
webauthn-authenticator-rs = { version = "0.6.1-dev", default-features = false, features = [
  "softpasskey",
] }
# The executor leptos's `spawn_local` dispatches into. Not needed by the app —
# `cargo-leptos` installs one — but `storage::hook`'s write-path test calls
# `Persistent::set` for real, and `spawn_local` panics in a debug build with no
# global executor set. The pool is never polled; the spawned future just parks.
any_spawner = { version = "0.3", features = ["futures-executor"] }
# Host-side second implementation of the wire format. WebCrypto exists only
# in a browser and this project has no wasm test runner, so these let an
# ordinary `cargo test` decrypt an envelope the browser would have written
# and produce one the browser must be able to read — pinning nonce
# placement, tag inclusion, base64 alphabet and HKDF inputs against a
# different implementation rather than against ourselves (spec section 10).
aes-gcm = "0.10"
aes-kw = "0.2"
hkdf = "0.12"
sha2 = "0.10"

[features]
default = []
hydrate = [
  "leptos/hydrate",
  "dep:console_error_panic_hook",
  "dep:wasm-bindgen",
  "dep:wasm-bindgen-futures",
  "dep:js-sys",
  "dep:web-sys",
  "dep:base64",
]
ssr = [
  "leptos/ssr",
  "leptos_meta/ssr",
  "leptos_router/ssr",
  "dep:leptos_axum",
  "dep:axum",
  "dep:axum-extra",
  "dep:tokio",
  "dep:diesel",
  "dep:diesel_migrations",
  "dep:libsqlite3-sys",
  "dep:lettre",
  "dep:ring",
  "dep:base64",
  "dep:hex",
  "dep:uuid",
  "dep:anyhow",
  "dep:tracing",
  "dep:tracing-subscriber",
  "dep:dotenvy",
  "dep:webauthn-rs",
  "dep:tower",
]

[profile.release]
codegen-units = 1
opt-level = 'z'
lto = true

[profile.wasm-release]
inherits = "release"
opt-level = 'z'
lto = true
codegen-units = 1
panic = "abort"

[package.metadata.leptos]
output-name          = "time-tracking-leptos"
site-root            = "target/site"
site-pkg-dir         = "pkg"
# Local dev only. The Docker image overrides this with LEPTOS_SITE_ADDR=0.0.0.0:80,
# because binding port 80 locally would need privileges.
site-addr            = "127.0.0.1:3000"
reload-port          = 3001
assets-dir           = "public"
tailwind-input-file  = "style/tailwind.css"
browserquery         = "defaults"
env                  = "DEV"
bin-features         = ["ssr"]
bin-default-features = false
lib-features         = ["hydrate"]
lib-default-features = false
lib-profile-release  = "wasm-release"
